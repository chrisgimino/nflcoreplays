<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFL Sunday Best</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* NFL Sunday Best page: data only (plus each Core play's note in its drawer). Look: PickLabs Sims / DFS Terminal themes,
   with a football field for the Core board. Light + dark (device setting unless the header button picked one). */
:root {
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; --num: "Big Shoulders Display", "Archivo", sans-serif;
  --courtline: #ffffff; --rim: #f26a1b; --orange: #e27539; --orange2: #d0632d;
}
/* DFS Terminal colours (light + dark) */
:root[data-theme="light"] {
  --ground: #e5e8ef; --surface: #ffffff; --panel2: #f1f2f5; --ink: #283654; --title: #05153f; --muted: #5e6d8a; --faint: #9fa7b8;
  --rule: #dde1e9; --rule-strong: #c7cedb; --accent: #e27539; --accent-soft: rgba(226, 117, 57, .10);
  --good: #23824a; --good-soft: rgba(35, 130, 74, .10); --bad: #c0392b; --bad-soft: rgba(192, 57, 43, .10);
  --hdr: #e5e8ef; --hdr-ink: #05153f; --hdr-sub: #5e6d8a; --sel: #e27539; --sel-ink: #ffffff; --ctl-bg: #ffffff; --ctl-ink: #283654;
  --dk: #1f8a55; --dk-soft: rgba(31, 138, 85, .10); --fd: #1d5fd1; --fd-soft: rgba(29, 95, 209, .08); --paint: #c3602f; --apron: #05153f;
  --core: #e27539; --core-ink: #b4521c; --core-soft: rgba(226, 117, 57, .12);
  --rowcore: linear-gradient(90deg, rgba(226, 117, 57, .16), rgba(226, 117, 57, .04) 45%, transparent 75%);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #05153f; --surface: #0b1c49; --panel2: #122551; --ink: #d7dce7; --title: #f1f2f5; --muted: #92a0ba; --faint: #6c7a99;
  --rule: #1d305c; --rule-strong: #2c3b61; --accent: #e27539; --accent-soft: rgba(226, 117, 57, .14);
  --good: #6fdc8c; --good-soft: rgba(111, 220, 140, .12); --bad: #ff8a7a; --bad-soft: rgba(255, 111, 94, .14);
  --hdr: #05153f; --hdr-ink: #f1f2f5; --hdr-sub: #92a0ba; --sel: #e27539; --sel-ink: #ffffff; --ctl-bg: #122551; --ctl-ink: #d7dce7;
  --dk: #5fd39a; --dk-soft: rgba(95, 211, 154, .10); --fd: #8fb4ff; --fd-soft: rgba(143, 180, 255, .09); --paint: #c3602f; --apron: #05153f;
  --core: #e27539; --core-ink: #ffb27f; --core-soft: rgba(226, 117, 57, .16);
  --rowcore: linear-gradient(90deg, rgba(226, 117, 57, .22), rgba(226, 117, 57, .05) 45%, transparent 75%);
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 14px 40px }

/* header: the Terminal's top bar */
.top { background: var(--hdr); color: var(--hdr-ink); border-bottom: 1px solid var(--rule-strong) }
.top .in { max-width: 1180px; margin: 0 auto; padding: 10px 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
.wm { display: block; flex: 0 0 auto } .wm img { height: 44px; display: block } .wm .d { display: none }
:root[data-theme="dark"] .wm .l { display: none } :root[data-theme="dark"] .wm .d { display: block }
.ttl { display: flex; flex-direction: column; min-width: 0; flex: 1; border-left: 2px solid var(--accent); padding-left: 14px }
.ttl h1 { margin: 0; font: 800 22px/1.05 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--title) }
.ttl h1 em { font-style: normal; color: var(--accent) }
.ttl .sub { font-size: 12.5px; color: var(--hdr-sub); margin-top: 4px }
.ttl .sub b { color: var(--title); font-weight: 800 }
.ttl .sched { font-size: 12px; color: var(--hdr-sub); margin-top: 3px } .ttl .sched b { color: var(--accent); font-weight: 800 }
.upd { font-size: 12px; color: var(--hdr-sub); text-align: right; line-height: 1.35 }
.upd b { color: var(--title) }
.upd .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3fcf7e; margin-right: 6px; animation: pulse 2s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .35 } }
.thm { background: var(--ctl-bg); color: var(--ctl-ink); border: 1px solid var(--rule-strong); border-radius: 6px; min-width: 34px; min-height: 32px; font-size: 15px; line-height: 1 }
@media (max-width: 640px) { .wm img { height: 34px } .ttl { border-left: 0; padding-left: 0; flex-basis: 100%; order: 2 } .ttl h1 { font-size: 17px } .ttl h1 em { display: none }
  .upd { text-align: left; order: 3; flex: 1 } .thm { order: 1; margin-left: auto } }

/* the Core board: a hardwood floor, DraftKings on one half, FanDuel on the other */
.board { position: relative; margin: 14px 0 12px; border-radius: 12px; overflow: hidden; background: var(--apron); min-height: 196px; box-shadow: 0 1px 0 var(--rule) }
.board svg.floor { position: absolute; inset: 0; width: 100%; height: 100% }
.board .halves { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 196px }
.half { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.half.r { align-items: flex-end } .half.r h2 { align-self: flex-end }
.half h2 { margin: 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font: 800 13px/1 var(--text); letter-spacing: .12em; text-transform: uppercase; color: #fff;
  background: rgba(5, 21, 63, .88); padding: 7px 10px; border-radius: 6px; border-left: 3px solid var(--orange) }
.half h2 small { font: 700 11px/1 var(--text); letter-spacing: .08em; color: #92a0ba }
.cchips { display: flex; flex-direction: column; gap: 6px; width: min(100%, 340px) }
.cchip { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 6px 10px 6px 6px; border-radius: 8px; text-align: left;
  background: rgba(5, 21, 63, .9); color: #fff; border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 4px 14px rgba(0, 0, 0, .28); width: 100% }
.cchip:hover { border-color: var(--orange) }
.cchip .pb { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; font: 900 13px/1 var(--text); color: #fff; letter-spacing: .03em }
.cchip .nm { min-width: 0 } .cchip .nm b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.cchip .nm span { display: block; font-size: 11.5px; color: #b9c6d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.cchip .nu { text-align: right; font-size: 11.5px; color: #b9c6d6; white-space: nowrap } .cchip .nu b { display: block; font: 800 20px/1 var(--num); color: #fff }
.cnone { color: #fff; font-size: 13px; background: rgba(5, 21, 63, .85); padding: 8px 10px; border-radius: 8px }
@media (max-width: 700px) { .board .halves { grid-template-columns: 1fr } .half.r { align-items: flex-start } .half.r h2 { align-self: flex-start } .cchips { width: 100% } }

.intro { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.5 }

/* tabs + controls */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; margin-bottom: 10px }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 9px 14px; font-weight: 700; font-size: 14.5px; color: var(--muted) }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent) }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 7px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink) }
.legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-left: auto }
.chip { display: inline-flex; align-items: center; border-radius: 4px; padding: 1px 6px; font: 800 10.5px/1.5 var(--text); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; border: 1px solid }
.chip.core { background: var(--core-soft); color: var(--core-ink); border-color: var(--core) }
.chip.q { background: var(--bad-soft); color: var(--bad); border-color: var(--bad) }
.chip.dk { background: var(--dk-soft); color: var(--dk); border-color: var(--dk) }
.chip.fd { background: var(--fd-soft); color: var(--fd); border-color: var(--fd) }

/* tables: the player column stays put on sideways scroll */
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px }
.t th, .t td { padding: 0 8px; height: 36px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); font-size: 13.5px }
.t thead th { height: 30px; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; position: sticky; top: 0; background: var(--panel2); z-index: 2 }
.t thead tr.band th { height: 24px; font: 800 12px/1 var(--text); letter-spacing: .08em }
.t thead tr.band th.dk { color: var(--dk); border-bottom: 2px solid var(--dk) } .t thead tr.band th.fd { color: var(--fd); border-bottom: 2px solid var(--fd) }
.t .nm { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--surface); color: var(--title); min-width: 210px; max-width: 260px; box-shadow: 1px 0 0 var(--rule) }
.t thead .nm { z-index: 3; background: var(--panel2) }
.t td.nm a { font-weight: 700; text-decoration: none } .t td.nm a:hover { text-decoration: underline }
.t td.nm .mt { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.t td.nm .ln1 { display: flex; align-items: center; gap: 6px; line-height: 1.25; padding-top: 5px; min-width: 0 } .t td.nm .ln1 a { overflow: hidden; text-overflow: ellipsis }
.t td.nm { padding-bottom: 5px }
.t .rk { color: var(--faint); font-size: 12px }
.t td.s0 { border-left: 1px solid var(--rule) }
.t .dim { color: var(--faint) }
.up { color: var(--good) } .down { color: var(--bad) }
.t td.vhi { font-weight: 800; color: var(--good) }
.t tr.pos td { height: 32px; background: var(--panel2); text-align: left; font: 800 13px/1 var(--text); letter-spacing: .12em; color: var(--accent) }
.t tr.pos td.nm { background: var(--panel2) }
.t tr.prow { cursor: pointer }
.t tr.prow:hover td { background-color: var(--accent-soft) } .t tr.prow:hover td.nm { background: var(--panel2) }
.t tr.prow.core td.nm { background: var(--surface) var(--rowcore); box-shadow: inset 4px 0 0 var(--core), 1px 0 0 var(--rule) }
.t tr.prow.core td { background-color: color-mix(in srgb, var(--core) 6%, var(--surface)) }
.t td.core-cell { font-weight: 800 }
.t td.dkc.core-cell { color: var(--dk) } .t td.fdc.core-cell { color: var(--fd) }
.t .tog { width: 34px; text-align: center; color: var(--accent); font-size: 12px }
.t tr.prow[aria-expanded="true"] .tog { transform: rotate(90deg) }
.t tr.prow[aria-expanded="true"] td { border-bottom-color: transparent }
.tswl { display: inline-flex; align-items: center; gap: 4px; font: 800 11px/1 var(--text); letter-spacing: .03em; vertical-align: -3px }
.tlg { width: 18px; height: 18px; object-fit: contain; display: block }
.cchip .tlg { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; margin-right: 4px }
.tsw { display: inline-block; min-width: 30px; padding: 1px 4px; border-radius: 3px; color: #fff; font: 800 10.5px/1.4 var(--text); text-align: center; letter-spacing: .03em }

/* drawers */
.t tr.drawer td { padding: 0; height: auto; text-align: left; background: var(--panel2); border-bottom: 1px solid var(--rule-strong) }
.dr { position: sticky; left: 0; width: min(100%, calc(100vw - 30px)); max-width: 1150px; padding: 12px 14px 14px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px 22px; white-space: normal }
.dr h4 { margin: 0 0 5px; font: 800 11px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.note { font-size: 14.5px; line-height: 1.55; border-left: 3px solid var(--core); padding: 2px 0 2px 12px; color: var(--ink) }
.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink) }
.facts li { padding-left: 14px; position: relative; line-height: 1.4 } .facts li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent) }
.kv { display: grid; grid-template-columns: auto repeat(2, minmax(64px, auto)); gap: 3px 16px; font-size: 13px; align-items: baseline; justify-content: start }
.kv .h { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase } .kv .h.dk { color: var(--dk) } .kv .h.fd { color: var(--fd) }
.kv .k { color: var(--muted) } .kv .v { text-align: right; font-weight: 700 }
@media (max-width: 700px) { .dr { grid-template-columns: minmax(0, 1fr) } }

/* sim range bars */
.rb { position: relative; height: 22px; min-width: 220px }
.rb .ax { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule) }
.rb .box { position: absolute; top: 5px; height: 12px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 30%, transparent); border: 1px solid var(--accent) }
.rb .med { position: absolute; top: 2px; width: 2px; height: 18px; margin-left: -1px; background: var(--ink) }
.rb .p99 { position: absolute; top: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent) }
.rb .pj { position: absolute; top: 0; width: 0; height: 22px; margin-left: -1px; border-left: 2px dashed var(--ink) }
.rbcap { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px }
.simkey { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 0 8px }
.simkey i { display: inline-block; vertical-align: -1px; margin-right: 5px }

/* role shifts / what if / games */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 10px }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.card > h3 { margin: 0; padding: 9px 12px; background: var(--panel2); color: var(--title); font: 800 14px/1.2 var(--text); letter-spacing: .04em; border-bottom: 2px solid var(--accent); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.card > h3 small { font: 600 12px/1.2 var(--text); color: var(--hdr-sub); letter-spacing: 0 }
.card .tw { border: 0; border-radius: 0 } .card table.t { min-width: 420px }
.chg { display: inline-block; position: relative; width: 70px; height: 9px; background: var(--panel2); border-radius: 3px; vertical-align: middle; margin-left: 6px }
.chg i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--good) }
.gcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden }
.gcard .gh { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--rule) }
.gcard .gh b { color: var(--title); font: 800 15px/1 var(--text); letter-spacing: .05em }
.gcard table { width: 100%; border-collapse: collapse } .gcard td, .gcard th { padding: 6px 12px; text-align: right; font-size: 13.5px } .gcard th { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em }
.gcard td:first-child, .gcard th:first-child { text-align: left }
.gcard .stripe { height: 6px; display: flex } .gcard .stripe i { flex: 1 }
.empty { padding: 40px 0; text-align: center; color: var(--muted) }
/* RG MVP preview (?preview=1) */
.cta { display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap; margin: 0 0 12px; padding: 14px 18px; border-radius: 12px;
  background: linear-gradient(120deg, #05153f, #122551); color: #fff; border: 1px solid #2c3b61 }
.cta b { display: block; font-size: 16px } .cta span { display: block; font-size: 13px; color: #c9d2e3; margin-top: 2px }
.cta a, .lockmsg a { background: var(--orange); color: #fff; text-decoration: none; font-weight: 800; border-radius: 8px; padding: 9px 16px; white-space: nowrap }
.t tr.lockr td { padding: 0; height: auto; background: var(--surface) }
.lkw { position: sticky; left: 0; width: min(100%, calc(100vw - 30px)); max-width: 1150px; padding: 10px 14px; min-height: 92px }
.lockpanel { position: relative; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); min-height: 170px }
.ghost { filter: blur(5px); opacity: .55; user-select: none; pointer-events: none; display: flex; flex-direction: column; gap: 8px; padding: 6px 0 }
.gbar { height: 10px; border-radius: 4px; background: var(--rule-strong) }
.lockmsg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 800; color: var(--title); text-align: center }
.foot { margin-top: 14px; font-size: 11.5px; color: var(--muted); line-height: 1.5 }
.nmw { display: flex; align-items: center; gap: 9px; min-width: 0 } .nmt { min-width: 0; flex: 1 }
.xbtn { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent); color: #fff; font: 800 17px/1 var(--text); box-shadow: 0 1px 4px rgba(226,117,57,.45) }
.t tr.prow[aria-expanded="true"] .xbtn { background: var(--title); color: var(--surface) }
.t td.nm .mt .inside { color: var(--accent); font-weight: 700 }
.t tr.prow:hover .inside { text-decoration: underline }
.dpill { display: inline-block; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font: 800 11px/1.3 var(--text); letter-spacing: .04em; white-space: nowrap }
.t tr.prow:hover .dpill, .t tr.prow[aria-expanded="true"] .dpill { background: var(--accent); color: #fff }
.t .tog { width: 12px } .t tr.prow[aria-expanded="true"] .tog { transform: none }
.t tr.prow[aria-expanded="true"] td { background-color: var(--accent-soft) }
.t tr.drawer td { border-left: 4px solid var(--accent) }
.hint { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent); font-size: 14px; color: var(--ink) }
.hint b { color: var(--title) }
.xbtn { position: relative } :root:not(.seen) .t tr.prow:not([aria-expanded="true"]) .xbtn::after, :root:not(.seen) .hint .xbtn::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); animation: blink 1.4s ease-out infinite }
@keyframes blink { 0% { opacity: .9; transform: scale(.85) } 100% { opacity: 0; transform: scale(1.5) } }
:root:not(.seen) .t tr.prow:not([aria-expanded="true"]) .dpill { animation: pill 1.4s ease-in-out infinite }
@keyframes pill { 50% { background: var(--accent); color: #fff } }
.t .nm { min-width: 240px; max-width: 300px }
.t td.nm .ln1 { overflow: hidden } .t td.nm .ln1 a { min-width: 0 } .t td.nm .ln1 .chip { flex: 0 0 auto }

/* NFL additions */
:root { --ez: #05153f }
.board { min-height: 220px } .board .halves { min-height: 220px; padding: 0 9% }
@media (max-width: 700px) { .board .halves { padding: 0 11% } }
.chip.gpp { background: var(--fd-soft); color: var(--fd); border-color: var(--fd) }
.chip.val { background: var(--good-soft); color: var(--good); border-color: var(--good) }
.good { color: var(--good) }
.pbadge { display: inline-block; min-width: 32px; padding: 2px 6px; border-radius: 4px; color: #fff; font: 800 11px/1.3 var(--text); text-align: center; letter-spacing: .05em }
.pills { display: flex; flex-wrap: wrap; gap: 5px }
.ex { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--surface) }
.ex.t1 { border-color: var(--core); color: var(--core-ink); background: var(--core-soft) }
.ex.t2 { border-color: var(--fd); color: var(--fd) }
.anl { display: flex; flex-direction: column; gap: 8px }
.blurb { font-size: 13.5px; line-height: 1.5; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px }
.blurb .by { display: block; font: 800 11px/1.2 var(--text); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px }
.tsel { font: inherit; font-weight: 700; padding: 6px 10px; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--ctl-bg); color: var(--ctl-ink) }
.gl { font-size: 13px; color: var(--muted) } .gl b { color: var(--title) }
.card > h3 { padding: 8px 12px }
.dep { display: flex; flex-direction: column }
.drow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 8px; padding: 7px 12px; border-bottom: 1px solid var(--rule); font-size: 13.5px }
.drow:last-child { border-bottom: 0 }
.drow .dn { color: var(--faint); font-weight: 800 } .drow .dnm { font-weight: 700; color: var(--title) }
.drow .dnote { grid-column: 2; font-size: 12px; color: var(--muted) }
.simkey { line-height: 1.5 }
.t td.nm .ln1 { overflow: hidden } .t td.nm .ln1 .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 } .t td.nm .ln1 .chip { flex: 0 0 auto }
.rgrow { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 8px; align-items: start; margin-bottom: 6px }
.rgrow .rb { min-width: 0 } .rgrow .rbcap { grid-column: 2 }
.rgl { font: 800 11px/22px var(--text); letter-spacing: .06em } .rgl.dk { color: var(--dk) } .rgl.fd { color: var(--fd) }
.t .tog { width: 12px }
.tlg { width: 16px; height: 16px; object-fit: contain; display: inline-block; vertical-align: -3px; margin-right: 3px }
.gl .tlg { width: 22px; height: 22px; vertical-align: -6px }
.nmw { display: flex; align-items: center; gap: 9px; min-width: 0 } .nmt { min-width: 0; flex: 1 }
.xbtn { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent); color: #fff; font: 800 17px/1 var(--text); box-shadow: 0 1px 4px rgba(226,117,57,.45) }
.t tr.prow[aria-expanded="true"] .xbtn { background: var(--title); color: var(--surface) }
.t td.nm .mt .inside { color: var(--accent); font-weight: 700 }
.t tr.prow:hover .inside { text-decoration: underline }
.dpill { display: inline-block; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font: 800 11px/1.3 var(--text); letter-spacing: .04em; white-space: nowrap }
.t tr.prow:hover .dpill, .t tr.prow[aria-expanded="true"] .dpill { background: var(--accent); color: #fff }
.t .tog { width: 86px }
.t tr.prow[aria-expanded="true"] .tog { transform: none }
.t tr.prow[aria-expanded="true"] td { background-color: var(--accent-soft) }
.t tr.drawer td { border-left: 4px solid var(--accent) }
.hint { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent); font-size: 14px; color: var(--ink) }
.hint b { color: var(--title) }
.xbtn { position: relative } :root:not(.seen) .t tr.prow:not([aria-expanded="true"]) .xbtn::after, :root:not(.seen) .hint .xbtn::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); animation: blink 1.4s ease-out infinite }
@keyframes blink { 0% { opacity: .9; transform: scale(.85) } 100% { opacity: 0; transform: scale(1.5) } }
:root:not(.seen) .t tr.prow:not([aria-expanded="true"]) .dpill { animation: pill 1.4s ease-in-out infinite }
@keyframes pill { 50% { background: var(--accent); color: #fff } }
.t .nm { min-width: 240px; max-width: 300px }
.t thead tr.band th.dk, .t thead tr.band th.fd { text-align: center }
</style>

  document.documentElement.setAttribute("data-theme", t); })();
</script>

"use strict";
const $ = id => document.getElementById(id);

const fm = (v, d = 1) => v == null || v === "" || Number.isNaN(+v) ? "–" : (+v).toFixed(d);

const POS = ["QB", "RB", "WR", "TE", "DST"];

// expert tiers follow the weighting order in NFLSundayBest.py (Notorious removed Nov 27 2026)
const EXPERT_TIER = { DavisMattek: 1, EBeimfohr: 1, VanekJordan: 2, BobbyGomes: 2, ncordfield8k: 2, Krayton: 3, Headchopper: 3 };
const exKeys = n => { const sp = String(n).replace(/([a-z0-9])(?=[A-Z])/g, "$1 "), t = sp.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  return t.length ? [t.slice().sort().join(""), t.join(""), String(n).toLowerCase().replace(/[^a-z0-9]/g, "")] : []; };
const TIER = {}; Object.entries(EXPERT_TIER).forEach(([n, t]) => exKeys(n).forEach(k => TIER[k] = t));
const tierOf = n => { for (const k of exKeys(n)) if (TIER[k]) return TIER[k]; return 3; };
// team logos: logos/index.json in the repo (abbr -> file), uploaded once
const ALIAS = { JAC: "JAX", WSH: "WAS", LA: "LAR", LVR: "LV", OAK: "LV", SD: "LAC", STL: "LAR", ARZ: "ARI", GNB: "GB", KAN: "KC", NWE: "NE", NOR: "NO", SFO: "SF", TAM: "TB" };
const canon = t => { t = String(t || "").toUpperCase(); return ALIAS[t] || t; };
const LOGO = {};
fetch("logos/index.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(j => {
  for (const [ab, f] of Object.entries(j || {})) LOGO[canon(ab)] = "logos/" + f; if (S.D) { renderBoard(); render(); } }).catch(() => {});
const lg = t => LOGO[canon(t)] ? `<img class="tlg" src="${esc(LOGO[canon(t)])}" alt="" onerror="this.remove()">` : "";
const tm = (t, o) => `${lg(t)}${esc(t)} vs ${lg(o)}${esc(o)}`;
const S = { D: null, view: "plays", pos: "ALL", site: "both", open: new Set(), team: null };

async function load() {
  try { const r = await fetch("nfl_sundaybest.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw r.status; S.D = await r.json(); }
  catch (e) { $("main").innerHTML = `<div class="empty">This week's slate isn't available yet.</div>`; return; }
  const D = S.D, g = D.games || [];
  $("sub").innerHTML = `Sunday main slate${g.length ? ` · <b>${g.length}</b> games` : ""}`;
  const u = new Date(D.updated);
  $("upd").innerHTML = `<span class="dot"></span>Updated <b>${isNaN(u) ? "" : u.toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) + " ET"}</b>`;
  const first = rows().find(r => r.core_dk || r.core_fd) || rows()[0];
  if (first) S.open.add(key(first));
  renderBoard(); render();
}
const rows = () => (S.D.sections || []).flatMap(s => s.players.map(p => Object.assign(p, { _pos: s.position })));
const key = r => r._pos + "|" + r.player_id;

function renderBoard() {
  const all = rows();
  for (const [s, flag] of [["dk", "core_dk"], ["fd", "core_fd"]]) {
    const R = all.filter(r => r[flag]).sort((a, b) => POS.indexOf(a._pos) - POS.indexOf(b._pos));
    $(s + "Line").textContent = R.length ? `${R.length} plays` : "";
    $(s + "Core").innerHTML = R.length ? R.map(r => { const b = r[s] || {};
      return `<button class="cchip" data-go="${esc(key(r))}" type="button"><span class="pb" style="background:${POS_COLOR[r._pos] || "#31567a"}">${esc(r._pos)}</span>
        <span class="nm"><b>${esc(r.players)}</b><span>${tm(r.team, r.opp)}</span></span><span class="nu"><b>${fm(b.fpts)}</b>${money(b.salary)}</span></button>`; }).join("")
      : `<div class="cnone">No Core plays on this site yet.</div>`;
  }
  $("board").onclick = e => { const b = e.target.closest("[data-go]"); if (!b) return;
    S.view = "plays"; S.pos = "ALL"; S.open.add(b.dataset.go); render();
    document.querySelector(`tr.prow[data-k="${CSS.escape(b.dataset.go)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }); };
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === S.view)));
  ({ plays: renderPlays, range: renderRange, inj: renderInj, lineups: renderLineups })[S.view]();
}

// ---- Sunday Best: DK and FD side by side, tap a row for the note, expert picks and analyst notes
function siteCells(r, s) {
  const b = r[s], rk = r[s + "_rank"], c = s + "c", core = r["core_" + s];
  if (!b) return `<td class="${c} s0 dim">–</td>` + `<td class="${c} dim">–</td>`.repeat(5);
  return `<td class="${c} s0 rk">${rk ? "#" + rk : ""}</td><td class="${c}">${money(b.salary)}</td><td class="${c}${core ? " core-cell" : ""}">${fm(b.fpts)}</td>
    <td class="${c}">${fm(b.ppd, 2)}</td><td class="${c}${b.opto != null && b.opto >= 15 ? " vhi" : ""}">${b.opto == null ? "–" : fm(b.opto) + "%"}</td><td class="${c}">${b.pown == null ? "–" : fm(b.pown) + "%"}</td>`;
}
function drawer(r, ncol) {
  const note = r.notes ? `<div><h4>Why he's here</h4><div class="note">${esc(r.notes)}</div></div>` : "";
  const ex = (r.experts || []).length ? `<div><h4>Expert picks${r.experts.length >= 4 ? ` · <span class="good">${r.experts.length} experts</span>` : ""}</h4><div class="pills">${r.experts.map(n => `<span class="ex t${tierOf(n)}">${esc(n)}</span>`).join("")}</div></div>` : "";
  const bl = (r.expert_blurbs || []).map(n => typeof n === "string" ? { text: n } : n).filter(n => n.text);
  const an = bl.length ? `<div><h4>Analyst notes</h4><div class="anl">${bl.map(n => `<div class="blurb">${n.author ? `<span class="by">${esc(n.author)}</span>` : ""}${esc(n.text)}</div>`).join("")}</div></div>` : "";
  const rng = ["dk", "fd"].filter(s => r[s] && r[s].ceil != null && r[s].fpts != null).map(s => {
    const b = r[s], lo = b.floor != null ? b.floor : 0, mx = Math.max(b.ceil, b.fpts) * 1.08, X = v => (100 * v / mx).toFixed(2) + "%";
    return `<div class="rgrow"><span class="rgl ${s}">${s.toUpperCase()}</span><div class="rb"><span class="ax"></span>
      <span class="box" style="left:${X(lo)};width:calc(${X(b.ceil)} - ${X(lo)})"></span><span class="pj" style="left:${X(b.fpts)}"></span><span class="p99" style="left:${X(b.ceil)}"></span></div>
      <div class="rbcap"><span>${b.floor != null ? "floor " + fm(b.floor) : ""}</span><span>proj ${fm(b.fpts)}</span><span>ceiling ${fm(b.ceil)}</span></div></div>`; }).join("");
  const sim = rng ? `<div><h4>Sim range</h4>${rng}</div>` : "";
  const kv = `<div><h4>By site</h4><div class="kv"><span></span><span class="h dk">DK</span><span class="h fd">FD</span>
    ${[["Salary", b => money(b.salary)], ["Projection", b => fm(b.fpts)], ["Ceiling", b => fm(b.ceil)], ["Floor", b => fm(b.floor)], ["Pts per $1K", b => fm(b.ppd, 2)],
       ["Opto", b => b.opto == null ? "–" : fm(b.opto) + "%"], ["Ownership", b => b.pown == null ? "–" : fm(b.pown) + "%"]]
      .map(([k, f]) => `<span class="k">${k}</span><span class="v">${r.dk ? f(r.dk) : "–"}</span><span class="v">${r.fd ? f(r.fd) : "–"}</span>`).join("")}</div></div>`;
  return `<tr class="drawer"><td colspan="${ncol}"><div class="dr"><div style="display:flex;flex-direction:column;gap:12px">${note}${ex}${an}${!note && !ex && !an ? `<div class="dim" style="font-size:13px">No note or expert tags on him this week.</div>` : ""}</div>
    <div style="display:flex;flex-direction:column;gap:12px">${sim}${kv}</div></div></td></tr>`;
}
function inside(r) {
  const bits = [];
  if (r.notes) bits.push("note");
  const n = (r.experts || []).length; if (n) bits.push(`${n} pick${n > 1 ? "s" : ""}`);
  const b = (r.expert_blurbs || []).length; if (b) bits.push(`${b} analyst`);
  return (bits.length ? "Open: " + bits.join(" · ") : "Open details") + " ▾";
}
function renderPlays() {
  const both = S.site === "both", sites = both ? ["dk", "fd"] : [S.site], ncol = 2 + 6 * sites.length;
  let body = "";
  for (const sec of S.D.sections || []) {
    const p = sec.position; if (S.pos !== "ALL" && p !== S.pos) continue;
    let R = sec.players.map(r => Object.assign(r, { _pos: p }));
    if (!both) R = R.filter(r => r[S.site + "_rank"]).sort((a, b) => a[S.site + "_rank"] - b[S.site + "_rank"]);
    if (!R.length) continue;
    body += `<tr class="pos"><td class="nm">${pb(p)}</td><td colspan="${ncol - 1}"></td></tr>`;
    for (const r of R) {
      const k = key(r), open = S.open.has(k), core = sites.some(s => r["core_" + s]);
      // one tag at most: Core (which site only when it's just one), plus the injury letter
      const cd = r.core_dk && sites.includes("dk"), cf = r.core_fd && sites.includes("fd");
      const chips = ((cd || cf) ? `<span class="chip core">${cd && cf ? "Core" : both ? (cd ? "Core DK" : "Core FD") : "Core"}</span>` : "")
        + (r.injury ? `<span class="chip q">${esc(r.injury)}</span>` : "");
      body += `<tr class="prow${core ? " core" : ""}" data-k="${esc(k)}" aria-expanded="${open}" tabindex="0">
        <td class="nm"><div class="nmw"><span class="xbtn" aria-hidden="true">${open ? "−" : "+"}</span><div class="nmt"><span class="ln1"><b class="pn">${esc(r.players)}</b>${chips}</span>
          <span class="mt">${tm(r.team, r.opp)}</span></div></div></td>
        ${sites.map(s => siteCells(r, s)).join("")}<td class="tog"></td></tr>`;
      if (open) body += drawer(r, ncol);
    }
  }
  const band = `<tr class="band"><th class="nm"></th>${sites.map(s => `<th class="${s}" colspan="6">${s === "dk" ? "DraftKings" : "FanDuel"}</th>`).join("")}<th></th></tr>`;
  const head = `<tr><th class="nm">Player</th>${sites.map(() => `<th class="s0">Rk</th><th>Sal</th><th>Proj</th><th title="Points per $1,000">Pt/$</th><th title="Share of optimal lineups">Opto</th><th>Own</th>`).join("")}<th></th></tr>`;
  const posList = ["ALL", ...(S.D.sections || []).map(s => s.position)];
  $("main").innerHTML = `<div class="ctl"><div class="seg">${posList.map(p => `<button data-p="${p}" aria-pressed="${p === S.pos}">${p === "ALL" ? "All" : p}</button>`).join("")}</div>
    <div class="seg">${[["both", "DK + FD"], ["dk", "DK"], ["fd", "FD"]].map(([v, l]) => `<button data-s="${v}" aria-pressed="${v === S.site}">${l}</button>`).join("")}</div>
    <div class="legend"><span><span class="chip core">Core</span> our top plays</span></div></div>
    <div class="hint"><span class="xbtn">+</span><span><b>Every player opens.</b> Tap any row for why he's here, the expert picks and the analysts' own notes.</span></div>
    <div class="tw"><table class="t"><thead>${band}${head}</thead><tbody>${body || `<tr><td class="nm">No plays.</td><td colspan="${ncol - 1}"></td></tr>`}</tbody></table></div>`;
}

// ---- sim range: floor to ceiling for every listed player, by position, one site at a time
function renderRange() {
  const site = S.site === "fd" ? "fd" : "dk", SN = site === "dk" ? "DK" : "FD";
  const R = rows().filter(r => (S.pos === "ALL" || r._pos === S.pos) && r[site] && r[site].ceil != null)
    .sort((a, b) => b[site].ceil - a[site].ceil);
  const posList = ["ALL", ...(S.D.sections || []).map(s => s.position)];
  const ctl = `<div class="ctl"><div class="seg">${posList.map(p => `<button data-p="${p}" aria-pressed="${p === S.pos}">${p === "ALL" ? "All" : p}</button>`).join("")}</div>
    <div class="seg">${[["dk", "DK"], ["fd", "FD"]].map(([v, l]) => `<button data-s="${v}" aria-pressed="${v === site}">${l}</button>`).join("")}</div></div>`;
  if (!R.length) { $("main").innerHTML = ctl + `<div class="empty">No ranges for this filter.</div>`; return; }
  const mx = Math.max(10, ...R.map(r => r[site].ceil)) * 1.04, X = v => (100 * v / mx).toFixed(2) + "%";
  const body = R.map(r => { const b = r[site], lo = b.floor != null ? b.floor : 0;
    return `<tr><td class="nm"><span class="ln1"><b class="pn">${esc(r.players)}</b>${r.injury ? `<span class="chip q">${esc(r.injury)}</span>` : ""}</span><span class="mt">${tm(r.team, r.opp)} · ${esc(r._pos)}</span></td>
      <td>${money(b.salary)}</td><td>${fm(b.fpts)}</td>
      <td style="width:40%;min-width:240px"><div class="rb"><span class="ax"></span><span class="box" style="left:${X(lo)};width:calc(${X(b.ceil)} - ${X(lo)})"></span>
        <span class="pj" style="left:${X(b.fpts)}"></span><span class="p99" style="left:${X(b.ceil)}"></span></div></td>
      <td>${fm(b.floor)}</td><td><b>${fm(b.ceil)}</b></td><td>${b.salary ? fm(b.ceil / b.salary * 1000, 2) : "–"}</td></tr>`; }).join("");
  $("main").innerHTML = `<div class="simkey"><span><i style="width:18px;height:10px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 30%,transparent);border-radius:2px;display:inline-block"></i>floor to ceiling</span>
    <span><i style="width:0;height:12px;border-left:2px dashed var(--ink);display:inline-block"></i>projection</span><span><i style="width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);display:inline-block"></i>ceiling</span>
    <span>${SN} fantasy points · sorted by ceiling</span></div>${ctl}
    <div class="tw"><table class="t"><thead><tr><th class="nm">Player</th><th>${SN} Sal</th><th>Proj</th><th style="text-align:left">Range</th><th>Floor</th><th>Ceiling</th><th title="Ceiling per $1,000 of salary">Ceil/$1K</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

// ---- injury report: questionable / doubtful / out on the main slate (from the projections feed)
const STW = { Q: "Questionable", D: "Doubtful", O: "Out", OUT: "Out", IR: "IR" };
function renderInj() {
  const R = S.D.injuries;
  if (!R) { $("main").innerHTML = `<div class="empty">This week's file has no injury report.</div>`; return; }
  if (!R.length) { $("main").innerHTML = `<div class="empty">No injury designations on the main slate.</div>`; return; }
  $("main").innerHTML = `<div class="simkey"><span>Practice-report designations on this week's DK or FD main slate, from our projections feed. Questionable players are docked in the Sunday Best grades; doubtful and out players aren't ranked.</span></div>
    <div class="tw"><table class="t"><thead><tr><th class="nm">Player</th><th style="text-align:left">Status</th><th style="text-align:left">Pos</th><th>DK Sal</th><th>DK Proj</th><th>FD Sal</th><th>FD Proj</th></tr></thead><tbody>
    ${R.map(r => `<tr><td class="nm"><span class="ln1"><b class="pn">${esc(r.name)}</b></span><span class="mt">${tm(r.team, r.opp)}</span></td>
      <td style="text-align:left"><span class="chip ${r.status === "Q" ? "core" : "q"}">${esc(STW[r.status] || r.status)}</span></td><td style="text-align:left">${pb(r.pos)}</td>
      <td>${money(r.dk_salary)}</td><td>${fm(r.dk_proj)}</td><td>${money(r.fd_salary)}</td><td>${fm(r.fd_proj)}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---- lineups: projected depth by team (top 4 by grade carry a data line)
function renderLineups() {
  const L = S.D.lineups || {}, teams = Object.keys(L).sort();
  if (!teams.length) { $("main").innerHTML = `<div class="empty">No lineup data available.</div>`; return; }
  if (!S.team || !L[S.team]) S.team = teams[0];
  const d = L[S.team], bits = [`vs ${lg(d.opponent)}<b>${esc(d.opponent)}</b>`];
  if (d.spread != null) bits.push(`spread <b>${d.spread}</b>`); if (d.total != null) bits.push(`total <b>${d.total}</b>`); if (d.favourite) bits.push(`fav <b>${esc(d.favourite)}</b>`);
  const cols = POS.filter(p => d.positions[p] && d.positions[p].length).map(p => `<div class="card"><h3>${pb(p)}</h3><div class="dep">${d.positions[p].map(x =>
    `<div class="drow${x.note ? " hn" : ""}"><span class="dn">${x.depth}</span><span class="dnm">${esc(x.name)}</span>${x.note ? `<span class="dnote">${esc(x.note)}</span>` : ""}</div>`).join("")}</div></div>`).join("");
  $("main").innerHTML = `<div class="ctl"><select class="tsel" id="tsel">${teams.map(t => `<option ${t === S.team ? "selected" : ""}>${esc(t)}</option>`).join("")}</select><span class="gl">${lg(S.team)} ${bits.join(" · ")}</span></div><div class="cards">${cols}</div>`;
  $("tsel").onchange = e => { S.team = e.target.value; renderLineups(); };
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (!b) return; S.view = b.dataset.v; render(); });
$("main").addEventListener("click", e => {
  const p = e.target.closest("[data-p]"); if (p) { S.pos = p.dataset.p; render(); return; }
  const s = e.target.closest("[data-s]"); if (s) { S.site = s.dataset.s; render(); return; }
  const tr = e.target.closest("tr.prow"); if (tr) { document.documentElement.classList.add("seen"); const k = tr.dataset.k; S.open.has(k) ? S.open.delete(k) : S.open.add(k); render(); }
});
$("main").addEventListener("keydown", e => { const tr = e.target.closest?.("tr.prow"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); } });
load();
})();
</script>
<script>
(function () {
  var b = document.getElementById("themeBtn"), root = document.documentElement;
  function paint() { var d = root.getAttribute("data-theme") === "dark"; b.textContent = d ? "☀" : "☾"; b.setAttribute("aria-label", d ? "Light theme" : "Dark theme"); b.title = b.getAttribute("aria-label"); }
  b.addEventListener("click", function () { var t = root.getAttribute("data-theme") === "dark" ? "light" : "dark"; root.setAttribute("data-theme", t);
    try { localStorage.setItem("plTheme", t); } catch (e) {} paint(); });
  paint();
})();
</script>
</body>
</html>
