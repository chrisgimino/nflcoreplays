<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Sunday Best &mdash; Core Plays</title>
<style>
  :root{
    --bg:#0a0c10;
    --panel:#12151b;
    --panel-alt:#171b22;
    --line:#232833;
    --text:#e7eaf0;
    --text-dim:#8a93a3;
    --core:#e8a33d;
    --core-dim:#4a3a1e;
    --qb:#5b8def;
    --rb:#3ecf8e;
    --wr:#e85d8e;
    --te:#a86bee;
    --dst:#ef7a4d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:22px 16px 60px;}

  header.masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 16px;
    border-bottom:2px solid var(--core);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  header.masthead .title-block h1{
    font-size:1.5rem;
    letter-spacing:0.02em;
    margin:0 0 2px;
    font-weight:800;
    text-transform:uppercase;
  }
  header.masthead .title-block h1 .accent{color:var(--core);}
  header.masthead .title-block .sub{
    color:var(--text-dim);
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  header.masthead .updated{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:0.72rem;
    color:var(--text-dim);
    text-align:right;
    white-space:nowrap;
  }
  header.masthead .updated .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--core);margin-right:6px;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .search{
    width:100%;
    margin-bottom:24px;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-size:0.9rem;
  }
  .search::placeholder{color:var(--text-dim);}
  .search:focus{outline:none;border-color:var(--core);}

  .legend{
    display:flex;gap:14px;flex-wrap:wrap;
    font-size:0.72rem;color:var(--text-dim);
    margin-bottom:20px;
    text-transform:uppercase;letter-spacing:0.04em;
  }
  .legend .flag{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--core-dim);color:var(--core);
    border:1px solid var(--core);
    border-radius:3px;padding:1px 6px;
    font-weight:700;font-size:0.68rem;
  }

  section.pos-block{margin-bottom:30px;}
  .pos-head{
    display:flex;align-items:center;gap:10px;
    margin-bottom:10px;
  }
  .pos-badge{
    font-weight:800;font-size:0.78rem;letter-spacing:0.06em;
    padding:4px 10px;border-radius:5px;
    color:#0a0c10;
  }
  .pos-badge.QB{background:var(--qb);}
  .pos-badge.RB{background:var(--rb);}
  .pos-badge.WR{background:var(--wr);}
  .pos-badge.TE{background:var(--te);}
  .pos-badge.DST{background:var(--dst);}
  .pos-count{color:var(--text-dim);font-size:0.75rem;}
  .pos-head hr{flex:1;border:none;border-top:1px solid var(--line);}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:8px;
    display:grid;
    grid-template-columns:34px 1fr;
    column-gap:12px;
    row-gap:4px;
    align-items:start;
    transition:border-color .15s ease, background .15s ease;
  }
  .card.is-core{
    border-left-color:var(--core);
    background:linear-gradient(90deg, rgba(232,163,61,0.07), var(--panel) 12%);
  }
  .card .rank{
    color:var(--text-dim);
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:0.85rem;
    padding-top:1px;
  }
  .card.is-core .rank{color:var(--core);}
  .row-name{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .player-name{font-weight:700;font-size:0.95rem;}
  .core-flag{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--core-dim);color:var(--core);
    border:1px solid var(--core);
    border-radius:3px;padding:1px 7px;
    font-size:0.65rem;font-weight:800;letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .core-flag::before{content:"\25B2";font-size:0.6rem;}
  .note{
    grid-column:2;
    color:var(--text-dim);
    font-size:0.86rem;
    line-height:1.4;
  }

  footer{
    text-align:center;color:var(--text-dim);font-size:0.72rem;
    margin-top:36px;letter-spacing:0.03em;
  }

  .empty-state, .error-state{
    color:var(--text-dim);text-align:center;padding:40px 0;font-size:0.9rem;
  }

  @media (max-width:520px){
    header.masthead{flex-direction:column;align-items:flex-start;}
    header.masthead .updated{text-align:left;}
    .title-block h1{font-size:1.25rem;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="title-block">
        <h1>NFL Sunday <span class="accent">Best</span></h1>
        <div class="sub">Preseason Core Plays</div>
      </div>
      <div class="updated" id="updated"><span class="dot"></span>loading&hellip;</div>
    </header>

    <input class="search" id="search" type="text" placeholder="Search players, positions, or notes&hellip;">

    <div class="legend">
      <span class="flag">&#9650; CORE</span>
      <span>= our top-conviction preseason plays</span>
    </div>

    <div id="content">
      <div class="empty-state">Loading slate&hellip;</div>
    </div>

  </div>

<script>
const DATA_URL = "nfl_preseason.json";

function fmtTimestamp(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short"
    });
  }catch(e){ return iso; }
}

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[m]));
}

function renderSection(section){
  const posClass = section.position.toUpperCase();
  const rows = section.players.map(p => `
    <div class="card ${p.core ? "is-core" : ""}">
      <div class="rank">${p.rank}</div>
      <div class="row-name">
        <span class="player-name">${escapeHtml(p.players)}</span>
        ${p.core ? '<span class="core-flag">Core</span>' : ""}
      </div>
      <div class="note">${escapeHtml(p.notes)}</div>
    </div>
  `).join("");

  return `
    <section class="pos-block" data-position="${posClass}">
      <div class="pos-head">
        <span class="pos-badge ${posClass}">${posClass}</span>
        <span class="pos-count">${section.players.length} ranked</span>
        <hr>
      </div>
      ${rows}
    </section>
  `;
}

function applyFilter(term){
  term = term.trim().toLowerCase();
  document.querySelectorAll("section.pos-block").forEach(sec => {
    let visibleCount = 0;
    sec.querySelectorAll(".card").forEach(card => {
      const text = card.textContent.toLowerCase();
      const posMatch = sec.dataset.position.toLowerCase().includes(term);
      const match = !term || text.includes(term) || posMatch;
      card.style.display = match ? "" : "none";
      if (match) visibleCount++;
    });
    sec.style.display = visibleCount ? "" : "none";
  });
}

fetch(DATA_URL, {cache: "no-store"})
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(data => {
    document.getElementById("updated").innerHTML =
      `<span class="dot"></span>Updated ${fmtTimestamp(data.updated)}`;
    const content = document.getElementById("content");
    if (!data.sections || !data.sections.length){
      content.innerHTML = '<div class="empty-state">No data available.</div>';
      return;
    }
    content.innerHTML = data.sections.map(renderSection).join("");
    document.getElementById("search").addEventListener("input", e => applyFilter(e.target.value));
  })
  .catch(err => {
    document.getElementById("updated").textContent = "Update failed";
    document.getElementById("content").innerHTML =
      `<div class="error-state">Couldn't load slate data (${escapeHtml(err.message)}). Check that nfl_preseason.json exists at the repo root.</div>`;
  });
</script>
</body>
</html>
